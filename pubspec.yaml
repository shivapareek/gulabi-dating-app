name: dating
description: Gulabi - dating app for Jaipur
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  image_picker: any
  google_fonts: any
  cached_network_image: any
  shared_preferences: any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: any

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#FF4F6E"
  adaptive_icon_foreground: assets/icon_fg.png

flutter:
  uses-material-design: true
