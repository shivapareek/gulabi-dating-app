name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --platforms android --org com.jaipur --project-name dating
          rm -rf test
          # App name, internet permission
          sed -i 's/android:label="dating"/android:label="Gulabi"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Firebase needs minSdk 23
          G=$(ls android/app/build.gradle* | head -1)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$G"
          grep -n "minSdk" "$G"

      - name: Install fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            cp signing/gulabi.keystore ~/.android/debug.keystore
          fi

      - name: Read Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
        run: |
          DEFINES=""
          if [ -z "$GOOGLE_SERVICES_JSON" ] && [ -f firebase/google-services.json ]; then
            GOOGLE_SERVICES_JSON=$(cat firebase/google-services.json)
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > gs.json
            CLIENT='.client[] | select(.client_info.android_client_info.package_name=="com.jaipur.dating")'
            DEFINES="--dart-define=FB_API_KEY=$(jq -r "$CLIENT | .api_key[0].current_key" gs.json)"
            DEFINES="$DEFINES --dart-define=FB_APP_ID=$(jq -r "$CLIENT | .client_info.mobilesdk_app_id" gs.json)"
            DEFINES="$DEFINES --dart-define=FB_PROJECT_ID=$(jq -r .project_info.project_id gs.json)"
            DEFINES="$DEFINES --dart-define=FB_SENDER_ID=$(jq -r .project_info.project_number gs.json)"
            DEFINES="$DEFINES --dart-define=FB_STORAGE_BUCKET=$(jq -r .project_info.storage_bucket gs.json)"
            echo "MODE=live" >> $GITHUB_ENV
          else
            echo "MODE=demo" >> $GITHUB_ENV
          fi
          if [ -n "$RAZORPAY_KEY" ]; then DEFINES="$DEFINES --dart-define=RAZORPAY_KEY=$RAZORPAY_KEY"; fi
          echo "DEFINES=$DEFINES" >> $GITHUB_ENV

      - name: Get packages and icons
        run: |
          mkdir -p ci-logs
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/pub.txt
          dart run flutter_launcher_icons 2>&1 | tee ci-logs/icons.txt

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-logs/analyze.txt

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release $DEFINES 2>&1 | tee ci-logs/build.txt
          cp build/app/outputs/flutter-apk/app-release.apk Gulabi-$MODE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gulabi-${{ env.MODE }}
          path: Gulabi-${{ env.MODE }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "Gulabi-$MODE.apk" \
            --title "Gulabi build ${{ github.run_number }} ($MODE)" \
            --notes "Android APK. Mode: $MODE. Commit ${{ github.sha }}" --latest

      - name: Save logs on failure
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/logs && cp -r ci-logs/. /tmp/logs/ 2>/dev/null || true
          git checkout --orphan ci-logs
          git rm -rf -q . || true
          cp -r /tmp/logs/. .
          git add -A
          git commit -q -m "logs ${{ github.run_number }}"
          git push -f origin ci-logs
